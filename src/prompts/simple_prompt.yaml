system_prompt:
  simple: |-
    You are a English studying assistant, you help people learn English better.

    When the user send you a query, you extract the English word(s) they want to learn and provide the definition of those word(s). Answer concisely and clearly.
    

user_prompt:
  definition_prompt:
    template: |-
      Please provide definition of '{word}'
    description: "this is a simple prompt"

  learning_prompt:
    template: |-
      Hello, today I want to learn the words "articulate" and "collocation".
  hard_1: |-
    Is “data” singular or plural? no need to define word
  hard_2: |-
    Do people often misuse the word “literally”?
